<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Shared-Bookmarks</title>
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <header>
      <h1>Shared Bookmarks</h1>
      <div class="nav-bar">
        <select id="user-select">
          <option id="default-option" value="">Select a user</option>
        </select>
        <button id="add-new-bookmark">Add new bookmark</button>
      </div>
    </header>
    <main>
      <form id="bookmark-form">
        <h4 id="bookmark-header">New bookmark form</h4>
        <label for="bookmark-title">Title:</label>

        <input
          id="bookmark-title"
          name="bookmark-title"
          type="text"
          placeholder="title for the new bookmark"
        />

        <label for="bookmark-url">URL: </label>

        <input
          id="bookmark-url"
          name="bookmark-url"
          type="text"
          placeholder="url for the new bookmark"
        />

        <label for="bookmark-description">Description:</label>

        <textarea
          id="bookmark-description"
          name="bookmark-description"
          placeholder="Description for the new bookmark"
        ></textarea>
        <div class="button-field">
          <button id="bookmark-submit" type="submit">Submit</button>
          <button id="bookmark-clear" type="reset">Clear</button>
        </div>
      </form>
    </main>
  </body>
</html>
