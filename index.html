<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Shared-Bookmarks</title>
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <header>
      <h1>Shared Bookmarks</h1>
      <div id="nav-bar">
        <div id="user-select-field">
          <label for="user-select" id="users-label">Users:</label>
          <select id="user-select">
            <option id="default-option" value="">Select a user</option>
          </select>
        </div>
        <div id="add-new-bookmark-field">
          <label for="add-new-bookmark">Add new bookmark:</label>
          <button
            id="add-new-bookmark"
            name="add-new-bookmark"
            type="button"
            disabled="true"
          >
            +
          </button>
        </div>
      </div>
    </header>
    <main>
      <template id="bookmark-card-template">
        <article class="bookmark-card" data-bookmark-id="">
          <h2 class="bookmark-title">
            <a class="bookmark-url" href=""></a>
          </h2>

          <p class="bookmark-description"></p>

          <time datetime="" class="created-time"></time>

          <button type="button" class="copy-btn">Copy</button>
          <button type="button" class="like-btn">❤️ 0</button>
        </article>
      </template>
      <section id="bookmark-display-area"></section>
      <aside id="form-drawer">
        <form id="bookmark-form">
          <h2 id="bookmark-form-header" name="bookmark-form-header">
            New bookmark form
          </h2>

          <label for="bookmark-title">Title:</label>
          <input
            id="bookmark-title"
            name="bookmark-title"
            type="text"
            placeholder="title for the new bookmark"
            required
          />

          <label for="bookmark-url">URL: </label>
          <input
            id="bookmark-url"
            name="bookmark-url"
            type="url"
            placeholder="http://..."
            required
          />

          <label for="bookmark-description">Description:</label>
          <textarea
            id="bookmark-description"
            name="bookmark-description"
            placeholder="Description for the new bookmark"
            required
          ></textarea>

          <div id="button-field">
            <button
              class="bookmark-form-button"
              id="bookmark-submit"
              type="submit"
            >
              Submit
            </button>
            <button
              class="bookmark-form-button"
              id="bookmark-clear"
              type="reset"
            >
              Clear
            </button>
          </div>
        </form>
      </aside>
    </main>
    <footer>Created by Brian & Ahmad</footer>
  </body>
</html>
